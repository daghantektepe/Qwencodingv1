name: OpenScriv CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Typecheck and Build Production Bundle
        run: npm run build

      - name: Run Vitest Test Suite (Unit & Ecosystem Integration)
        run: npm test

      - name: Run Real Electron Windows Smoke Test
        if: runner.os == 'Windows'
        run: npm run smoke

      - name: Package Windows Distribution (NSIS Installer & Portable EXE)
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Upload Windows Distribution Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: openscriv-windows-dist
          path: release-builds/*.exe
