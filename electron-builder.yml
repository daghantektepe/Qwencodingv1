appId: com.openscriv.desktop
productName: OpenScriv
copyright: "Copyright © 2026 OpenScriv Authors"
npmRebuild: false
publish: null

directories:
  output: release-builds
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

fileAssociations:
  - ext: opscriv
    name: OpenScriv Project Package
    description: OpenScriv Native Writing Studio Project
    role: Editor
    mimeType: application/x-openscriv

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  fileAssociations:
    - ext: opscriv
      name: OpenScriv Project Package

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenScriv

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

linux:
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
