appId: com.openscriv.app
productName: OpenScriv
copyright: Copyright © 2026 OpenScriv Contributors

directories:
  output: release/
  buildResources: build/

files:
  - dist/**/*
  - src/electron/**/*
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenScriv

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: build/icon.icns

linux:
  target:
    - target: AppImage
    - target: deb
  category: Office
  icon: build/icons
