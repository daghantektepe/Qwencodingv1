# OpenScriv - electron-builder yapilandirmasi (Faz 15)
# Varsayilan hedef: Windows NSIS kurulum paketi; macOS ve Linux icin de
# ayni dosya ile paket uretilebilir (capraz platform).

appId: com.openscriv.desktop
productName: OpenScriv
copyright: Copyright © 2026 OpenScriv Contributors

# Uygulama metadata
directories:
  output: dist/electron-builder
  buildResources: build

# Pakete dahil edilecek dosyalar (Vite build ciktilari + Electron kabugu)
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!node_modules/**/*"

# Asar ile paketlemeden once harici derlenmesi gereken dogal bagimlilik yok.
asar: true

# Tum platformlar icin ortak metadata
extraMetadata:
  main: electron/main.js

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: OpenScriv
  installerLanguages:
    - tr_TR
    - en_US
  license: LICENSE

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  icon: build/icon.icns

linux:
  target:
    - AppImage
    - deb
  maintainer: OpenScriv Contributors
  category: Utility
  icon: build/icon.png

publish: null
